name: Deploy to Vercel

on:
  push:
    branches: [master, main]
  pull_request:

# antrekan run di ref yang sama; JANGAN batalkan di tengah upload
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: web

      - name: Build (preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: web

      - name: Deploy preview
        working-directory: web
        run: |
          for i in 1 2 3; do
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} && exit 0
            echo "attempt $i gagal, ulangi dalam 15 detik..."
            sleep 15
          done
          exit 1

  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: web

      - name: Build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: web

      - name: Deploy production
        working-directory: web
        run: |
          for i in 1 2 3; do
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} && exit 0
            echo "attempt $i gagal, ulangi dalam 15 detik..."
            sleep 15
          done
          exit 1
